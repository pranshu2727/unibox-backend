<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Department</title>
    <style>
        body {
          margin: 0;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          background: #f5f6fa;
          color: #333;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }
        .form-container {
          background: #fff;
          padding: 40px;
          border-radius: 8px;
          box-shadow: 0 0 10px rgba(0,0,0,0.15);
          width: 100%;
          max-width: 400px;
        }
        h2 {
          text-align: center;
          color: #2c3e50;
          margin-bottom: 30px;
        }
        input, button {
          width: 100%;
          padding: 12px;
          margin: 10px 0;
          border: 1px solid #ccc;
          border-radius: 4px;
          font-size: 16px;
          background: #f9f9f9;
        }
        button {
          background-color: #2c3e50;
          color: #fff;
          font-weight: bold;
          cursor: pointer;
          transition: background-color 0.3s ease;
        }
        button:hover {
          background-color: #1a252f;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Add New Department</h2>
    <form id="addDeptForm">
        <input type="text" id="deptName" placeholder="Department Name" required>
        <input type="email" id="deptEmail" placeholder="Department Email" required>
        <input type="password" id="deptPassword" placeholder="Password" required>
        <button type="submit">Add Department</button>
    </form>
    <button onclick="goBack()">⬅ Back to Dashboard</button>
</div>

<script>
    const token = localStorage.getItem("adminToken");
    if (!token) {
      alert("Please login first.");
      window.location.href = "/admin/index.html";
    }
    document.getElementById("addDeptForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("deptName").value;
      const userEmail = document.getElementById("deptEmail").value;
      const password = document.getElementById("deptPassword").value;

      const res = await fetch("/api/departments/add", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ name, userEmail, password })
      });

      if (res.ok) {
        alert("Department added successfully!");
        window.location.href = "/admin/dashboard.html";
      } else {
        const err = await res.text();
        alert("Failed to add department: " + err);
      }
    });
    function goBack() {
      window.location.href = "/admin/dashboard.html";
    }
</script>
</body>
</html>
