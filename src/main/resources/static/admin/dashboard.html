<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <style>
        body {
          margin: 0;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          background: #f5f6fa;
          color: #333;
          min-height: 100vh;
          padding: 20px;
        }
        h2 {
          color: #2c3e50;
          text-align: center;
          margin-bottom: 30px;
        }
        h3 {
          color: #2c3e50;
          margin-top: 40px;
        }
        .button-container {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          margin-bottom: 30px;
        }
        button {
          background-color: #2c3e50;
          color: #fff;
          font-weight: bold;
          padding: 10px 20px;
          margin: 10px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
          transition: background-color 0.3s ease;
        }
        button:hover {
          background-color: #1a252f;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 20px;
          background: #fff;
          border-radius: 6px;
          overflow: hidden;
          box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        th, td {
          border: 1px solid #ddd;
          padding: 10px;
          text-align: left;
        }
        th {
          background-color: #2c3e50;
          color: #fff;
        }
        tr:nth-child(even) {
          background: #f2f2f2;
        }
        td button {
          background-color: #c0392b;
          color: #fff;
          padding: 6px 10px;
          font-size: 14px;
          border: none;
          border-radius: 3px;
          cursor: pointer;
        }
        td button:hover {
          background-color: #922b21;
        }
        a {
          color: #2c3e50;
          text-decoration: none;
        }
        a:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>

<h2>Welcome, Admin</h2>

<div class="button-container">
    <button onclick="fetchDepartments()">📂 View All Departments</button>
    <button onclick="fetchAllComplaints()">📂 View All Complaints</button>
    <button onclick="window.location.href='/admin/add-department.html'">➕ Add Department</button>
    <button onclick="logout()">🚪 Logout</button>
</div>

<h3>Departments</h3>
<table id="departmentsTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<h3>All Complaints</h3>
<table id="complaintsTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>User ID</th>
        <th>Department ID</th>
        <th>Description</th>
        <th>Image</th>
        <th>Latitude</th>
        <th>Longitude</th>
        <th>Location</th>
        <th>Status</th>
        <th>Reply</th>
        <th>Created At</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    const token = localStorage.getItem("adminToken");
    if (!token) {
      alert("You must login first.");
      window.location.href = "/admin/index.html";
    }
    function logout() {
      localStorage.removeItem("adminToken");
      window.location.href = "/admin/index.html";
    }
    async function fetchDepartments() {
      const res = await fetch("/api/departments", {
        headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) {
        alert("Failed to fetch departments. Please login again.");
        logout();
        return;
      }
      const departments = await res.json();
      const tableBody = document.querySelector("#departmentsTable tbody");
      tableBody.innerHTML = "";
      departments.forEach(dept => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${dept.id}</td>
          <td>${dept.name}</td>
          <td>${dept.userEmail}</td>
          <td><button onclick="deleteDepartment(${dept.id})">🗑 Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }
    async function deleteDepartment(id) {
      if (!confirm("Are you sure you want to delete this department?")) return;
      const res = await fetch(`/api/departments/${id}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token }
      });
      const msg = await res.text();
      if (res.ok) {
        alert("Department deleted.");
        fetchDepartments();
      } else {
        alert("Error: " + msg);
      }
    }
    async function fetchAllComplaints() {
      const res = await fetch("/api/complaints", {
        headers: { Authorization: "Bearer " + token }
      });
      if (!res.ok) {
        alert("Failed to fetch complaints. Please login again.");
        logout();
        return;
      }
      const complaints = await res.json();
      const tableBody = document.querySelector("#complaintsTable tbody");
      tableBody.innerHTML = "";
      complaints.forEach(c => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${c.id}</td>
          <td>${c.user?.id || 'N/A'}</td>
          <td>${c.department?.id || 'N/A'}</td>
          <td>${c.description}</td>
          <td>${c.imageUrl ? `<a href="${c.imageUrl}" target="_blank">View</a>` : 'No Image'}</td>
          <td>${c.latitude || ''}</td>
          <td>${c.longitude || ''}</td>
          <td>${c.location || ''}</td>
          <td>${c.status}</td>
          <td>${c.reply || ''}</td>
          <td>${new Date(c.createdAt).toLocaleString()}</td>
          <td><button onclick="deleteComplaint(${c.id})">🗑 Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }
    async function deleteComplaint(id) {
      if (!confirm("Are you sure you want to delete this complaint?")) return;
      const res = await fetch(`/api/complaints/${id}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token }
      });
      const msg = await res.text();
      if (res.ok) {
        alert("Complaint deleted.");
        fetchAllComplaints();
      } else {
        alert("Error: " + msg);
      }
    }
</script>
</body>
</html>
